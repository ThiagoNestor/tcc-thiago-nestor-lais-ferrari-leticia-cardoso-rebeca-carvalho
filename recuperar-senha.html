<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Recuperar senha — Growly</title>
    <link rel="icon" type="image/jpeg" href="assets/logo-original.jpeg" />

  <meta
    name="description"
    content="Recupere o acesso à sua conta Growly."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

  <div class="screen no-nav">

    <img data-leaf="top-left" />
    <img data-leaf="bottom-right" />

    <main class="auth-main">

      <a href="index.html">
        <img
          class="auth-logo"
          src="assets/logo-inicio.png"
          alt="Growly"
        />
      </a>

      <div class="auth-body">

        <form class="stack" id="form-recuperar">

          <div class="auth-intro">
            <h1>Recupere sua senha</h1>

            <p>
              Informe o e-mail da sua conta e enviaremos
              um link para você criar uma nova senha.
            </p>
          </div>

          <p
            class="form-error"
            id="erro"
            hidden
          ></p>

          <p
            class="form-success"
            id="sucesso"
            hidden
          ></p>

          <div class="field">
            <label for="email">Email</label>

            <input
              id="email"
              type="email"
              autocomplete="email"
              required
            />
          </div>

          <button
            class="btn btn-secondary btn-block"
            type="submit"
            id="enviar"
          >
            Enviar link
          </button>

          <p class="form-footer">
            Lembrou sua senha?
            <a href="login.html">Voltar ao login</a>
          </p>

        </form>

      </div>
    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/app.js"></script>
  <script src="js/recuperar-senha.js"></script>

</body>
</html>
