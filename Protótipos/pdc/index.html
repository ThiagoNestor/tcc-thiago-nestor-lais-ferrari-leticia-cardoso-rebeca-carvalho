<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Scanner de Plantas</title>
</head>
<body>

<h1>Scanner de Plantas</h1>

<input type="file" id="image-upload">

<h2>Resultado:</h2>
<div id="resultado"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

<script>
let model;

const labels = ["Planta01", "Bambu", "Espada-de-São-Jorge", "ND"];

async function carregarModelo() {
    model = await tf.loadLayersModel("model.json");
    console.log("Modelo carregado!");
}

carregarModelo();

document.getElementById("image-upload").addEventListener("change", async function(event) {
    const arquivo = event.target.files[0];

    const img = document.createElement("img");
    img.src = URL.createObjectURL(arquivo);

    img.onload = async () => {
        let tensor = tf.browser.fromPixels(img)
            .resizeNearestNeighbor([224, 224])
            .toFloat()
            .div(127.5)
            .sub(1)
            .expandDims();

        const previsao = await model.predict(tensor).data();
        const resultados = Array.from(previsao);

        let maiorIndice = resultados.indexOf(Math.max(...resultados));
        let nome = labels[maiorIndice];
        let confianca = resultados[maiorIndice] * 100;

        document.getElementById("resultado").innerHTML = `
            <h3>${nome}</h3>
            <p>Confiança: ${confianca.toFixed(2)}%</p>
        `;
    };
});
</script>

</body>
</html>
