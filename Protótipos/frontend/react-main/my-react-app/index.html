<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Botão Brilhante</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f0f1a;
      font-family: Arial, sans-serif;
    }

    .container {
      text-align: center;
      color: white;
    }

    button {
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 16px;
      color: white;
      background: #6a00ff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 10px #6a00ff;
    }

    button:hover {
      background: #8c2bff;
      box-shadow: 0 0 20px #8c2bff, 0 0 40px #8c2bff;
      transform: scale(1.05);
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Botão </h1>
    <p>Passe o mouse </p>

    <button>Clique aqui</button>
  </div>
</body>
</html>
