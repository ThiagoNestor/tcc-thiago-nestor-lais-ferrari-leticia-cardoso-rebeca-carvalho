<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Configurações — Growly</title>
    <meta name="description" content="Gerencie seu perfil e sua conta no Growly." />
    <link rel="icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="screen">
      <img data-leaf="top-left" />
      <img data-leaf="top-right" />
      <main class="page-main">
        <div data-header="Configurações"></div>
        <p class="page-sub">Gerencie seu perfil e sua conta.</p>

        <form class="stack" id="form-perfil">
          <p class="form-ok" id="status" hidden></p>
          <div class="field">
            <label for="conta-email">Email</label>
            <input id="conta-email" type="email" disabled />
          </div>
          <div class="field">
            <label for="conta-nome">Nome de usuário</label>
            <input id="conta-nome" type="text" />
          </div>
          <button class="btn btn-secondary btn-block" type="submit" id="salvar">
            Salvar alterações
          </button>
        </form>

        <button class="plant-btn remove" style="margin-top: 1.5rem" id="sair">Sair da conta</button>
      </main>
      <nav class="bottom-nav" data-nav></nav>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="js/app.js"></script>
    <script src="js/configuracoes.js"></script>
  </body>
</html>
