<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Cadastro — Growly</title>

  <meta
    name="description"
    content="Crie sua conta Growly e comece a identificar PANCs."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />

  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="css/styles.css"
  />
</head>

<body>

  <div class="screen no-nav">

    <img data-leaf="top-left" />
    <img data-leaf="bottom-right" />

    <main class="auth-main">

      <a href="index.html">
        <img
          class="auth-logo"
          src="assets/logo-inicio.png"
          alt="Growly"
        />
      </a>

      <div class="auth-body">

        <form
          class="stack"
          id="form-cadastro"
        >

          <!-- MENSAGENS -->
          <p
            class="form-error"
            id="erro"
            hidden
          ></p>

          <p
            class="form-ok"
            id="aviso"
            hidden
          ></p>


          <!-- EMAIL -->
          <div class="field">

            <label for="email">
              Email
            </label>

            <input
              id="email"
              type="email"
              autocomplete="email"
              required
            />

          </div>


          <!-- NOME DE USUÁRIO -->
          <div class="field">

            <label for="username">
              Nome de Usuário
            </label>

            <input
              id="username"
              type="text"
              autocomplete="username"
              required
            />

          </div>


          <!-- SENHA -->
          <div class="field">

            <label for="password">
              Senha
            </label>

            <div class="password-input-wrapper">

  <input
    id="password"
    type="password"
    autocomplete="new-password"
    required
  />

  <button
    type="button"
    class="password-toggle"
    data-password-toggle="password"
    aria-label="Mostrar senha"
  >
    👁
  </button>

</div>
            <div
              class="password-requisitos"
              id="password-requisitos"
            >

              <p class="password-requisitos-titulo">
                Sua senha deve conter:
              </p>

              <div
                class="password-regra invalida"
                id="regra-tamanho"
              >
                <span class="regra-icone">✕</span>
                <span>Pelo menos 6 caracteres</span>
              </div>

              <div
                class="password-regra invalida"
                id="regra-maiuscula"
              >
                <span class="regra-icone">✕</span>
                <span>Uma letra maiúscula</span>
              </div>

              <div
                class="password-regra invalida"
                id="regra-numero"
              >
                <span class="regra-icone">✕</span>
                <span>Um número</span>
              </div>

              <div
                class="password-regra invalida"
                id="regra-especial"
              >
                <span class="regra-icone">✕</span>
                <span>Um caractere especial</span>
              </div>

            </div>

          </div>


          <!-- CONFIRMAR SENHA -->
          <div class="field">

            <label for="confirm-password">
              Confirmar senha
            </label>

            <div class="password-input-wrapper">

  <input
    id="confirm-password"
    type="password"
    autocomplete="new-password"
    required
  />

  <button
    type="button"
    class="password-toggle"
    data-password-toggle="confirm-password"
    aria-label="Mostrar senha"
  >
    👁
  </button>

</div>

            <div
              class="password-match invalida"
              id="password-match"
            >
              <span class="regra-icone">✕</span>
              <span>As senhas devem ser iguais</span>
            </div>

          </div>


          <!-- BOTÃO CADASTRAR -->
          <button
            class="btn btn-secondary btn-block"
            type="submit"
            id="enviar"
          >
            Cadastrar
          </button>


          <!-- LOGIN -->
          <p class="form-footer">

            Já possui uma conta?

            <a href="login.html">
              Fazer login
            </a>

          </p>

        </form>

      </div>

    </main>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <script src="js/app.js"></script>

  <script src="js/cadastro.js"></script>

</body>

</html>
